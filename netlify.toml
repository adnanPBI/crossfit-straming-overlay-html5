[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?route=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/control"
  to = "/control.html"
  status = 200

[[redirects]]
  from = "/overlay"
  to = "/overlay.html"
  status = 200

[[redirects]]
  from = "/remote"
  to = "/remote.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
