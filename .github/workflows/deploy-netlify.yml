name: Deploy WOD Stream Studio to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wod-netlify-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Netlify dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test && npm run check
      - name: Find or create Netlify site
        id: site
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_NAME: wod-studio-1415661536
        run: node scripts/netlify-site.mjs
      - name: Validate controller secret
        env:
          CONTROL_KEY: ${{ secrets.OVERLAY_CONTROL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CONTROL_KEY" ] || [ "${#CONTROL_KEY}" -lt 12 ]; then
            echo 'Set OVERLAY_CONTROL_KEY (12+ characters) in GitHub Actions secrets.' >&2; exit 1
          fi
          echo 'Controller secret provided.'
      - name: Create server-only salted verifier
        env:
          CONTROL_KEY: ${{ secrets.OVERLAY_CONTROL_KEY }}
        run: node scripts/generate-control-verifier.mjs
      - name: Deploy static UI and serverless functions
        id: publish
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          ./node_modules/.bin/netlify deploy --prod --site "$SITE_ID" --dir=public --functions=netlify/functions --skip-functions-cache --message "WOD Studio ${GITHUB_SHA}" --json > netlify-deploy.json
          node -e 'const d=require("./netlify-deploy.json"); console.log("Production URL:", d.website_url||d.deploy_url||d.url||"unknown");'
      - name: Verify site and API
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          CONTROL_KEY: ${{ secrets.OVERLAY_CONTROL_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$SITE_URL/api/health" > health.json; then break; fi
            sleep 5
          done
          node --input-type=module -e 'import fs from "node:fs";const h=JSON.parse(fs.readFileSync("health.json","utf8")); if(!h.ok||h.mode!=="netlify"||h.controllerConfigured!==true)throw Error("Production controller verifier missing");console.log("Health verified",h);'
          auth_code="$(curl -sS --max-time 20 -o auth.json -w '%{http_code}' -X POST -H "X-Overlay-Key: $CONTROL_KEY" "$SITE_URL/api/auth")"
          [ "$auth_code" = "200" ] || { echo "Live controller auth HTTP $auth_code" >&2; exit 1; }
          node --input-type=module -e 'import fs from "node:fs";if(JSON.parse(fs.readFileSync("auth.json","utf8")).ok!==true)process.exit(1)'
          bad_code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H "X-Overlay-Key: definitely-wrong-control-key-for-qa" "$SITE_URL/api/auth")"
          [ "$bad_code" = "401" ] || { echo "Invalid key improperly accepted" >&2; exit 1; }
          echo 'Live authentication, rejection and health checks passed.'
          curl -fsS --max-time 20 "$SITE_URL/" > homepage.html
          node --input-type=module -e 'import fs from "node:fs";const t=fs.readFileSync("homepage.html","utf8");if(!t.includes("WOD Stream Studio")||!t.includes("/control"))throw Error("Homepage broken")'
          curl -fsS --max-time 20 "$SITE_URL/sample-logo.png" -o sample-logo-smoke.png
          node --input-type=module -e 'import fs from "node:fs";if(fs.readFileSync("sample-logo-smoke.png").subarray(0,8).toString("hex")!=="89504e470d0a1a0a")throw Error("Logo asset missing")'
          curl -fsS --max-time 20 "$SITE_URL/control" > /dev/null
          curl -fsS --max-time 20 "$SITE_URL/remote" > /dev/null
          curl -fsS --max-time 20 "$SITE_URL/overlay" > /dev/null
      - name: Seed isolated production persistence test
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          CONTROL_KEY: ${{ secrets.OVERLAY_CONTROL_KEY }}
          WOD_QA_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/netlify-acceptance.mjs seed
      - name: Redeploy same release to exercise durable storage
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          ./node_modules/.bin/netlify deploy --prod --site "$SITE_ID" --dir=public --functions=netlify/functions --skip-functions-cache --message "WOD Studio persistence acceptance ${GITHUB_SHA}" --json > netlify-redeploy.json
      - name: Verify persistence after redeploy and remove QA data
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          CONTROL_KEY: ${{ secrets.OVERLAY_CONTROL_KEY }}
          WOD_QA_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/netlify-acceptance.mjs verify
      - name: Deployment link
        if: always()
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
        run: |
          printf '\n### WOD Stream Studio Netlify deploy\n\n- Site: %s\n- Control: %s/control\n- Overlay: %s/overlay\n- Phone: %s/remote\n' "$SITE_URL" "$SITE_URL" "$SITE_URL" "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
